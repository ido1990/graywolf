[workspace]
members = ["graywolf-modem"]
# third_party/alsa-rs is a [patch.crates-io] source (see below), not a
# first-party member. Exclude it so cargo doesn't try to fold it into the
# workspace, and so its own tests can run standalone.
exclude = ["third_party/alsa-rs"]
resolver = "2"

# This workspace manifest declares the repo root as a cargo workspace whose
# sole member is the graywolf-modem crate. The reason it exists is to make
# cross-rs's Docker-based cross builds mount the whole repo root (so the
# shared proto/ schema and VERSION file are accessible from inside the
# container), not just the crate subdirectory.
#
# As a side effect, cargo places the shared build output at /target/ rather
# than graywolf-modem/target/ — several path references (Makefile, main.go,
# bridge.go, integration tests, release workflow) depend on this location.

# Fix for the t64 ALSA crash + the 32-bit htstamp-overflow loop on 32-bit
# Raspberry Pi OS (issue #231). Two problems on the same hardware:
#
#  1. On a t64 system libasound writes a 16-byte struct timespec; stock
#     alsa-rs reads it into an 8-byte libc::timespec and smashes the stack.
#     The vendored crate reads the htstamp accessors into a 16-byte buffer so
#     the C call cannot overflow -- without compiling for time64, so the armhf
#     binary still links against the (pre-t64) cross toolchain and keeps
#     running on older 32-bit systems too.
#  2. cpal's ALSA backend, given a non-zero htstamp, takes its hardware
#     timestamp path and computes `tv_sec * 1e9` in i32, which overflows on
#     32-bit for any uptime over ~2 s and errors every period (a crash-rebuild
#     loop that silences audio). The vendored crate's `decode_htstamp` returns
#     (0, 0) so cpal picks its software-timestamp fallback; graywolf discards
#     the value anyway.
#
# Vendored under third_party/alsa-rs (forked from chrissnell/alsa-rs @ bd06687,
# which is diwic/alsa-rs 0.11.0 + the t64 buffer fix). See
# docs/plans/2026-06-11-armhf-t64-alsa-htstamp-fix.md. Drop once both fixes are
# released upstream.
[patch.crates-io]
alsa = { path = "third_party/alsa-rs" }
